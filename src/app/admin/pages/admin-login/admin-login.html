<div class="admin-login-page">
  <div class="admin-login-card">
    <div class="brand">VISTA</div>

    <h1>VISTA Admin Portal</h1>
    <p class="subtitle">Đăng nhập để quản lý hệ thống</p>

    <form (submit)="onSubmit($event)">
      <!-- Email -->
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          (ngModelChange)="clearError()"
          placeholder="Nhập email của bạn"
          autocomplete="username"
          required
        />
      </div>

      <!-- Mật khẩu -->
      <div class="form-group password-group">
        <label for="password">Mật khẩu</label>

        <div class="password-input">
          <input
            id="password"
            name="password"
            [(ngModel)]="password"
            [type]="showPassword ? 'text' : 'password'"
            [class.is-invalid]="!!errorMessage"
            (ngModelChange)="clearError()"
            placeholder="Nhập mật khẩu"
            autocomplete="current-password"
            required
          />

          <button
            type="button"
            class="toggle-password"
            (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
          >
            <svg
              *ngIf="!showPassword"
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
              />
              <circle cx="12" cy="12" r="3" />
            </svg>

            <svg
              *ngIf="showPassword"
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="m3 3 18 18" />
              <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
              <path
                d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a15.8 15.8 0 0 1-4 4.8"
              />
              <path
                d="M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7c1.4 0 2.7-.3 3.8-.8"
              />
            </svg>
          </button>
        </div>

        <!-- Thông báo lỗi ngay dưới ô mật khẩu -->
        <p
          class="error-message"
          *ngIf="errorMessage"
          role="alert"
        >
          {{ errorMessage }}
        </p>
      </div>

      <!-- Ghi nhớ đăng nhập và quên mật khẩu -->
      <div class="login-options">
        <label class="remember-option">
          <input type="checkbox" name="remember" />
          <span>Ghi nhớ đăng nhập</span>
        </label>

        <a href="/admin/forgot-password">Quên mật khẩu?</a>
      </div>

      <!-- Nút đăng nhập -->
      <button
        type="submit"
        class="login-button"
        [disabled]="isLoading"
      >
        {{ isLoading ? 'Đang đăng nhập...' : 'Đăng nhập' }}
      </button>
    </form>

    <div class="card-footer">
      Chỉ dành cho tài khoản quản lý và nhân viên VISTA.
    </div>
  </div>
</div>
