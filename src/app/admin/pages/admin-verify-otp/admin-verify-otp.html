<div class="forgot-page">
  <main class="forgot-card">
    <div class="brand">VISTA</div>

    <h1>Xác thực OTP</h1>

    <p class="subtitle">
      Nhập mã xác minh gồm 6 chữ số để tiếp tục quá trình đặt lại mật khẩu.
    </p>

    <form (submit)="onSubmit($event)">
      <!-- Email xác nhận -->
      <div class="form-group">
        <label for="email">Email xác nhận</label>

        <input
          id="email"
          name="email"
          type="email"
          [value]="email"
          readonly
        />
      </div>

      <!-- Sáu ô nhập mã OTP -->
      <div class="form-group otp-group">
        <label>Mã xác minh</label>

        <div class="otp-inputs">
          <input
            *ngFor="let digit of otpDigits; let i = index; trackBy: trackByIndex"
            #otpInput
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="1"
            [value]="otpDigits[i]"
            [attr.aria-label]="'Chữ số OTP thứ ' + (i + 1)"
            [attr.autocomplete]="i === 0 ? 'one-time-code' : 'off'"
            (input)="onOtpInput($event, i)"
            (keydown)="onOtpKeydown($event, i)"
            (paste)="onOtpPaste($event, i)"
            required
          />
        </div>

        <p class="helper-text">
          Vui lòng nhập mã OTP được gửi đến email của bạn.
        </p>
      </div>

      <!-- Thông báo lỗi -->
      <p
        class="error-message"
        *ngIf="errorMessage"
        role="alert"
      >
        {{ errorMessage }}
      </p>

      <!-- Nút xác nhận -->
      <button type="submit" class="submit-button">
        {{ isLoading ? 'Đang xác minh...' : 'Xác nhận mã' }}
      </button>
    </form>

    <a class="back-link" routerLink="/admin/forgot-password">
      Quay lại nhập email
    </a>

    <div class="card-footer">
      Chỉ dành cho tài khoản quản lý và nhân viên VISTA.
    </div>
  </main>
</div>
