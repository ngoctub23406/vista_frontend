<!-- Splash screen chỉ hiển thị ở giao diện User -->
<div
  class="splash-screen"
  [class.fade-out]="isClosing"
  *ngIf="showSplash && !isAdminRoute"
>
  <div class="splash-content">
    <img src="/logo.png" alt="VISTA" class="splash-logo">

    <h2 class="splash-slogan">
      Nền tảng tư vấn công nghệ thông minh
    </h2>

    <div class="loading-bar">
      <div class="loading-progress"></div>
    </div>
  </div>

  <div class="splash-footer">
    <p>© 2026 VISTA. All rights reserved.</p>
  </div>
</div>

<!-- Giao diện Admin -->
<ng-container *ngIf="isAdminRoute">
  <router-outlet></router-outlet>
</ng-container>

<!-- Giao diện User -->
<ng-container *ngIf="!isAdminRoute && !showSplash">
  <app-navbar></app-navbar>

  <router-outlet></router-outlet>

  <button
    class="scroll-top-btn"
    *ngIf="showScrollTop"
    (click)="scrollToTop()"
  >
    <i class="ph ph-caret-double-up"></i>
    <span>Lên đầu</span>
  </button>

  <app-footer></app-footer>

  <app-compare-widget></app-compare-widget>
</ng-container>
